<header
  class="flex-0 fixed top-0 z-10 flex h-16 w-full items-center justify-between overflow-hidden border-b-4 border-amber-400 bg-[#ffe8c7] dark:bg-stone-800 text-stone-700/70 dark:text-stone-300/70 xl:h-24"
>
  <span
    class="flex relative justify-between items-center w-full whitespace-nowrap shrink xl:mx-auto xl:max-w-6xl"
  >
    <!-- only shown in mobile version -->
    <div
      id="burger"
      class="flex absolute top-0 right-0 justify-center items-center w-20 h-full max-h-full bg-white/50 dark:bg-black/50 hover:cursor-pointer hover:text-stone-800 dark:hover:text-stone-300 xl:hidden"
    >
      <iconify-icon
        class="pointer-events-none"
        icon="iconamoon:menu-burger-horizontal-light"
        width="50"
        height="50"
      ></iconify-icon>
    </div>
    <!-- only shown if screen >= xl:1280px -->
    <div
      class="flex justify-between items-center px-8 h-16 text-center whitespace-nowrap header text-stone-800/70 hover:cursor-default xl:h-24 dark:text-stone-300"
    >
      <span class="text-xl">{{site.nav_title_1}}</span
      ><i class="pt-0.5 text-2xl header-second">{{site.nav_title_2}}</i>
    </div>
    {% for nav in site.navs %}
    <a
      class="group nav-link flex h-16 flex-1 items-center xl:h-24 max-xl:pointer-events-none {%if nav.link%}hover:cursor-pointer hover:text-stone-800 dark:hover:text-stone-300 hover:underline hover:underline-offset-4{%else%}pointer-events-none inactive{%endif%}"
      href="{%if nav.link%}{{site.baseurl}}{{nav.link}}{%endif%}"
    >
      <div class="px-12 max-xl:hidden">{{nav.text}}</div>
    </a>
    {% endfor %}
  </span>
</header>
