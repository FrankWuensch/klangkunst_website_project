<!-- only shown in mobile version -->
<span
  id="mobile-menu"
  class="pointer-events-none absolute right-0 top-16 z-20 w-[50%] flex-col items-center justify-center divide-y divide-stone-700/30 dark:divide-stone-300/30 rounded-bl-xl border-b border-l border-stone-400 dark:border-stone-800 bg-stone-50 dark:bg-stone-950 text-lg text-stone-700/70 dark:text-stone-300/70 opacity-0 duration-700 ease-in-out xl:pointer-events-none xl:hidden"
>
  {%for nav in site.navs%}
  <a
    class="group w-full nav-link flex justify-end px-8 py-4 text-right {%if nav.link%}hover:cursor-pointer{%else%}pointer-events-none inactive{%endif%}"
    href="{%if nav.link%}{{site.baseurl}}{{nav.link}}{%endif%}"
  >
    <div
      class="{%if nav.link%}hover:text-stone-800 dark:hover:text-stone-300 group-hover:underline hover:underline-offset-4{%else%}inactive{%endif%}"
    >
      {{nav.text}}
    </div>
  </a>
  {%endfor%}
  <div class="flex flex-col gap-y-2 px-8 py-4 w-full text-sm text-right">
    {%for ref in site.references%}
      <a href="{{site.baseurl}}{{ref.link}}" class="flex flex-row gap-x-2 justify-end mx-2 w-full underline underline-offset-4" target="_blank">{{ref.name}} {{ref.icon}}</a>
    {%endfor%}
  </div>
</span>
