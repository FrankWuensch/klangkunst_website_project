<!DOCTYPE html>
<html class="w-full h-full" lang="de">
  <head>
    <title>{{page.title}}</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="referrer" content="no-referrer" />
    {%if page.block_index or page.block_follow%}
    <meta
      name="robots"
      content="{%if page.block_index and page.block_follow%}noindex, nofollow{%elsif page.block_index%}noindex{%elsif page.block_follow%}nofollow{%endif%}"
    />
    {%endif%}
    <link href="{{site.baseurl}}favicon.ico" rel="icon" />
    <script src="{{site.baseurl}}src/darkmode.js"></script>
    <link href="{{site.baseurl}}src/fonts.css" rel="stylesheet" />
    <link href="{{site.baseurl}}dist/output.css" rel="stylesheet" />
    <link href="{{site.baseurl}}src/markdown.css" rel="stylesheet" />
    <script src="{{site.baseurl}}src/iconify-min.js"></script>
  </head>

  <body
    class="relative normal mx-auto h-full w-full flex-1 overflow-y-auto hyphens-auto py-10 xl:py-20 bg-gradient-to-r from-[#ffe8c780] dark:from-neutral-800 from-10% via-[#ffe8c780] dark:via-neutral-800 via-70% to-[#ffe8c7] dark:to-neutral-900 bg-fixed"
  >
    {% include menu.html %} {% include header.html %}
    <main
      id="main-container"
      class="overflow-y-auto relative flex-1 py-10 mx-auto w-full h-full hyphens-auto xl:py-20"
    >
      <div id="content" class="px-8 mx-auto w-full xl:max-w-6xl">
        {{content}}
      </div>
      <div
        id="wrapper"
        class="flex fixed inset-0 z-50 justify-center items-center pointer-events-none"
      >
        <div
          id="large-image-wrapper"
          class="flex relative justify-center items-center opacity-0 duration-700 ease-in-out"
        >
          <img id="large-image" class="object-contain cursor-pointer" />
        </div>
      </div>
    </main>
    <script src="{{site.baseurl}}src/menu.js"></script>
    <script src="{{site.baseurl}}src/active_elements.js"></script>
  </body>
</html>
